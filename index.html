<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindShare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>MindShare</h1>
      <p>Eine kleine Mindmap-Uebung zum Sammeln und Verbinden von Ideen.</p>
    </header>

    <form class="idea-form" id="idea-form">
      <label for="idea-input">Neue Idee</label>
      <div class="idea-form-row">
        <input id="idea-input" type="text" placeholder="Idee eingeben">
        <button type="submit">Hinzufuegen</button>
      </div>
    </form>

    <section class="mindmap" id="mindmap" aria-label="Mindmap Arbeitsbereich">
      <div class="node node-main">Meine Idee</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
